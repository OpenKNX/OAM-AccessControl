; New Home Key libraries are opt-in. PlatformIO's chain scanner also sees
; headers inside disabled preprocessor branches, so exclude them explicitly.
[env]
lib_ignore =
  OFM-HomeKey
  DigitalDoorKey
  PN7161
  HomeSpan

[custom]
; lib_deps=
;   frankboesing/FastCRC
;   https://github.com/ab-tools/lz4.git
;   https://github.com/ab-tools/PN7160
build_flags =
  ${KNX_TP.build_flags}
  -D OPENKNX_LOOPTIME_WARNING=100

[custom_develop]
extends = custom
build_flags = 
  ${custom.build_flags}
  -D OPENKNX_HEARTBEAT
debug_build_flags = 
  ${OPENKNX_DEBUG.build_flags}
  -ggdb3
  -D OPENKNX_HEARTBEAT


[RP2040_FLASH]
build_flags =
  -D KNX_FLASH_SIZE=0x20000
  -D KNX_FLASH_OFFSET=0x140000
  -D OPENKNX_FLASH_SIZE=0x4000
  -D OPENKNX_FLASH_OFFSET=0x160000
  -D FINGERPRINT_FLASH_SIZE=0x11000
  -D FINGERPRINT_FLASH_OFFSET=0x12F000
  -D NFC_FLASH_SIZE=0x11000
  -D NFC_FLASH_OFFSET=0x11E000
  -D KEYPAD_FLASH_SIZE=0x11000
  -D KEYPAD_FLASH_OFFSET=0x10D000

[RP2040_custom]
extends = RP2040, RP2040_16MB, custom
board_build.filesystem_size = 15314944
build_flags = 
  -D PN7160_RP2040
  -D SERIAL_DEBUG=Serial
  -D USE_KNX_DMA_UART=0
  -D USE_KNX_DMA_IRQ=0
  -D MAX_TX_QUEUE=100
  -D MAX_RX_QUEUE_BYTES=1024
  -Wunused-variable

[RP2040_custom_develop]
extends = RP2040_develop, RP2040_custom, custom_develop
build_flags = 
  ${RP2040_develop.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_develop.build_flags}
  ;-D BOARD_AB_SMARTHOUSE_FINGERPRINT_V13
  -D DEVICE_UP1_SEN_8X
  ;-D USE_DATASECURE
debug_build_flags = 
  ${custom_develop.debug_build_flags}
  -O0

[RP2040_custom_releases]
extends = RP2040_releases, RP2040_custom, custom
build_flags = 
  ${RP2040_releases.build_flags}
  ${RP2040_custom.build_flags}
  ${custom.build_flags}

[env:debug_RP2040]
extends = RP2040_custom_develop

; ESP32 platform target. Peripheral wiring and hardware validation pending.
; Home Key authentication/provisioning is not enabled by this environment.
[env:debug_ESP32S3_HomeKey]
extends = ESP32_develop, ESP32_8MB, custom_develop
; Local XIAO/HomeKey profiles use Arduino 3.3.8 / ESP-IDF 5.5.4.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
board_build.partitions = hardware/esp32s3_homekey_8mb.csv
debug_tool = esp-builtin
build_flags =
  ${ESP32_develop.build_flags}
  ${custom_develop.build_flags}
  -D BOARD_XIAO_ESP32S3_HOMEKEY
  -D SERIAL_DEBUG=Serial

; Compile the optional scanner, keypad, expanders, binary inputs and relay paths.
; Pin assignments describe a prototype, not a validated carrier board.
[env:debug_ESP32S3_PN7160_Peripherals]
extends = env:debug_ESP32S3_HomeKey
build_flags =
  ${env:debug_ESP32S3_HomeKey.build_flags}
  -D OPENKNX_ACC_TEST_PERIPHERALS

[env:upload_JLINK_RP2040]
extends = RP2040_custom_develop, UPLOAD_JLINK

[env:release_R503]
extends = RP2040_custom_releases
build_flags = 
  ${RP2040_custom_releases.build_flags}
  -D BOARD_AB_SMARTHOUSE_FINGERPRINT_V13
debug_build_flags =
  ${RP2040_custom_develop.debug_build_flags}

[env:release_R503Pro]
extends = RP2040_custom_releases
build_flags = 
  ${RP2040_custom_releases.build_flags}
  -D BOARD_AB_SMARTHOUSE_FINGERPRINT_V13

[env:release_VAC_REG1]
extends = RP2040_custom_releases
build_flags = 
  ${RP2040_custom_releases.build_flags}
  -D OKNXHW_REG1_BASE_V1

[env:release_UP1]
extends = RP2040_custom_releases
build_flags = 
  ${RP2040_custom_releases.build_flags}
  -D DEVICE_UP1_SEN_8X

; Arduino-only Home Key integration gate; legacy reader profiles stay available.
[env:debug_ESP32S3_AppleHomeKey]
extends = env:debug_ESP32S3_HomeKey
extra_scripts =
  pre:scripts/HomeKey-Build.py
  ${env.extra_scripts}
lib_ignore = PN7160
lib_deps =
  ${env.lib_deps}
  https://github.com/HomeSpan/HomeSpan.git#107ffc07f4455754ea89068d8cf2e992de3583e6
build_unflags = -std=gnu++17 -std=gnu++11 -std=gnu++14 -std=gnu++20 -std=gnu++2a -std=gnu++2b
build_flags =
  ${env:debug_ESP32S3_HomeKey.build_flags}
  -std=gnu++23
  -D OPENKNX_HOMEKEY_ENABLED
  -D OPENKNX_ACC_DISABLE_LEGACY_NFC
